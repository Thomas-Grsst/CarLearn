name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Liste des radars fixes
        run: dart run tool/build_speed_cameras.dart radars/radars.json

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/carlearn-release.jks
          printf "storeFile=carlearn-release.jks\nstorePassword=%s\nkeyAlias=carlearn\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties

      - name: Compilation de l'APK
        run: flutter build apk --release

      - name: Renommage
        run: cp build/app/outputs/flutter-apk/app-release.apk en-route.apk

      - uses: actions/upload-artifact@v4
        with:
          name: en-route-apk
          path: en-route.apk

      - name: Publication dans la release « latest »
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest en-route.apk \
            --title "En route — dernière version" \
            --notes "APK compilé automatiquement depuis le commit ${GITHUB_SHA::7}. Ouvre ce lien depuis ton téléphone Android et installe en-route.apk."
